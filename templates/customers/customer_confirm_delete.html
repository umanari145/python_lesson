{% extends 'base.html' %}

{% block title %}顧客削除確認 - 顧客管理システム{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{% url 'customers:customer_detail' customer.pk %}" class="text-primary-600 hover:text-primary-900">
        &larr; 詳細に戻る
    </a>
</div>

<div class="card">
    <div class="card-header">
        <h1 class="text-2xl font-bold text-red-600">顧客削除確認</h1>
    </div>
    <div class="card-body">
        <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-700">
                        以下の顧客情報を削除してもよろしいですか？この操作は取り消せません。
                    </p>
                </div>
            </div>
        </div>

        <div class="bg-gray-50 p-6 rounded-lg mb-6">
            <dl class="grid grid-cols-1 gap-4">
                <div>
                    <dt class="text-sm font-medium text-gray-500">氏名</dt>
                    <dd class="mt-1 text-lg text-gray-900">{{ customer.full_name }}</dd>
                </div>
                <div>
                    <dt class="text-sm font-medium text-gray-500">メールアドレス</dt>
                    <dd class="mt-1 text-gray-900">{{ customer.email }}</dd>
                </div>
                <div>
                    <dt class="text-sm font-medium text-gray-500">電話番号</dt>
                    <dd class="mt-1 text-gray-900">{{ customer.phone_number }}</dd>
                </div>
            </dl>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="flex justify-end space-x-3">
                <a href="{% url 'customers:customer_detail' customer.pk %}" class="btn-secondary">
                    キャンセル
                </a>
                <button type="submit" class="btn-danger">
                    削除する
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
