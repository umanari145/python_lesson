<div>
    <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-gray-700 mb-2">
        {{ label }}
    </label>
    <select 
        name="{{ field.name }}" 
        id="{{ field.id_for_label }}"
        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition duration-200"
    >
        <option value="">選択してください</option>
        {% for value, label_text in field.field.choices %}
            {% if value %}
                <option value="{{ value }}" {% if field.value == value or field.value|stringformat:"s" == value|stringformat:"s" %}selected{% endif %}>{{ label_text }}</option>
            {% endif %}
        {% endfor %}
    </select>
    {% if field.errors %}
        <ul class="mt-2 space-y-1">
            {% for error in field.errors %}
                <li class="text-sm text-red-600">{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</div>
