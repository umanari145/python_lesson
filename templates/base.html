<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}顧客管理システム{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}bg-gray-50 min-h-screen{% endblock %}">
    <!-- ナビゲーションバー -->
    <nav class="bg-white shadow-md mb-6">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-6">
                    <a href="{% url 'customers:customer_list' %}" class="text-xl font-bold text-gray-800 hover:text-blue-600">
                        🏢 顧客管理システム
                    </a>
                    <a href="{% url 'customers:customer_list' %}" class="text-gray-600 hover:text-blue-600 {% if request.resolver_match.url_name == 'customer_list' %}text-blue-600 font-semibold{% endif %}">
                        顧客一覧
                    </a>
                    <a href="{% url 'customers:sales_list' %}" class="text-gray-600 hover:text-blue-600 {% if 'sales' in request.resolver_match.url_name %}text-blue-600 font-semibold{% endif %}">
                        売上一覧
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- メッセージ表示エリア -->
    {% if messages %}
        <div class="container mx-auto px-4 mb-6">
            {% for message in messages %}
                <div class="p-4 rounded-lg {% if message.tags == 'success' %}bg-green-100 text-green-800 border border-green-200{% elif message.tags == 'warning' %}bg-yellow-100 text-yellow-800 border border-yellow-200{% elif message.tags == 'error' %}bg-red-100 text-red-800 border border-red-200{% else %}bg-blue-100 text-blue-800 border border-blue-200{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- メインコンテンツ -->
    {% block content %}
    {% endblock %}

    <!-- JavaScriptブロック -->
    {% block extra_js %}
    {% endblock %}
</body>
</html>
