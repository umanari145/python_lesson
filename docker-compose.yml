services:
  db:
    image: postgres:15
    container_name: django_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb01
    ports: ["5432:5432"]
    networks:
      - django
  web:
    build: .
    container_name: django_app
    volumes:
      - .:/app
    ports: ["8000:8000"]
    tty: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      POSTGRES_DB: testdb01
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on: 
      - db
    networks:
      - django

networks:
  django:
    driver: bridge