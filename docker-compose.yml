version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: customer_db
    environment:
      POSTGRES_DB: customer_management
      POSTGRES_USER: djangouser
      POSTGRES_PASSWORD: djangopass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djangouser"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: customer_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://djangouser:djangopass@db:5432/customer_management
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:

